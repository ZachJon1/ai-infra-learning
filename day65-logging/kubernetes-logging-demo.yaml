apiVersion: v1
kind: Namespace
metadata:
  name: ai-infra-logging
---
apiVersion: v1
kind: Pod
metadata:
  name: logging-demo
  namespace: ai-infra-logging
  labels:
    app: logging-demo
spec:
  restartPolicy: Always
  containers:
    - name: logger
      image: busybox:1.36
      imagePullPolicy: IfNotPresent
      command:
        - /bin/sh
        - -c
        - |
          if [ ! -f /state/restarted ]; then
            touch /state/restarted
            printf '{"level":"ERROR","event":"simulated_crash","pod":"%s"}\n' "$HOSTNAME" >&2
            exit 1
          fi
          while true; do
            printf '{"level":"INFO","event":"heartbeat","pod":"%s"}\n' "$HOSTNAME"
            sleep 5
          done
      volumeMounts:
        - name: state
          mountPath: /state
  volumes:
    - name: state
      emptyDir: {}
