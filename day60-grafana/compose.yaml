services:
  grafana:
    image: grafana/grafana:latest
    container_name: day60-grafana
    restart: unless-stopped
    network_mode: host
    environment:
      GF_SERVER_HTTP_ADDR: "127.0.0.1"
      GF_SERVER_HTTP_PORT: "3000"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
volumes:
  grafana-data:
