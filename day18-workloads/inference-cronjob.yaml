apiVersion: batch/v1
kind: CronJob
metadata:
  name: inference-cron

spec:
  schedule: "*/1 * * * *"

  concurrencyPolicy: Forbid

  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: inference
              image: busybox:1.36
              command:
                - /bin/sh
                - -c
                - |
                  echo "Starting long inference"
                  date
                  sleep 90
                  echo "Inference complete"

          restartPolicy: Never
