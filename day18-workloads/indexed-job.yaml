apiVersion: batch/v1
kind: Job
metadata:
  name: indexed-inference
spec:
  completions: 6
  parallelism: 2
  completionMode: Indexed

  template:
    spec:
      containers:
        - name: worker
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - |
              echo "Worker index: $JOB_COMPLETION_INDEX"
              echo "Processing partition $JOB_COMPLETION_INDEX"
              sleep 10
              echo "Partition $JOB_COMPLETION_INDEX complete"

      restartPolicy: Never
