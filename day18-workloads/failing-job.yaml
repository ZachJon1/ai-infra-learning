apiVersion: batch/v1
kind: Job
metadata:
  name: failing-job
spec:
  backoffLimit: 3
  template:
    spec:
      containers:
        - name: worker
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - |
              echo "Starting inference..."
              sleep 2
              echo "ERROR: model could not be loaded"
              exit 1
      restartPolicy: Never
