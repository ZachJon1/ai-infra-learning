apiVersion: batch/v1
kind: Job
metadata:
  name: inference-job
spec:
  template:
    spec:
      containers:
        - name: inference
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - |
              echo "Starting batch inference..."
              sleep 5
              echo "Processing images..."
              sleep 5
              echo "Inference complete."
      restartPolicy: Never
