:root{
  --page:#DFE3F1; --bar:#FFFFFF; --bar-ink:#1B1E3F; --muted:#5D628C; --accent:#3550FF; --line:#1B1E3F; --chip:#EEF0F8;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--page:#111329;--bar:#1D2042;--bar-ink:#EEF0FF;--muted:#A6ABD8;--accent:#8E9CFF;--line:#3A3F72;--chip:#272B55;color-scheme:dark}
}
:root[data-theme="dark"]{--page:#111329;--bar:#1D2042;--bar-ink:#EEF0FF;--muted:#A6ABD8;--accent:#8E9CFF;--line:#3A3F72;--chip:#272B55;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--page);color:var(--bar-ink);font-family:'Rec',ui-rounded,system-ui,sans-serif;font-variation-settings:'CASL' .5}
#app{height:100%;display:flex;flex-direction:column;gap:12px;padding:12px;max-width:1600px;margin:0 auto}
#viewport{position:relative;flex:1;min-height:180px;overflow:hidden;border-radius:18px}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden;
  background-color:#EEF0F8;background-image:radial-gradient(#CBD1EA 2.4px,transparent 2.9px);background-size:40px 40px;
  color:#1B1E3F;font-family:'Rec',sans-serif;font-variation-settings:'CASL' .5;font-weight:520}
#bigplay{position:absolute;left:50%;top:50%;width:132px;height:132px;margin:-66px 0 0 -66px;border-radius:50%;border:5px solid #1B1E3F;
  background:#FFC933;box-shadow:8px 8px 0 #1B1E3F;cursor:pointer;display:grid;place-items:center;padding:0}
#bigplay:hover{transform:translate(-2px,-2px);box-shadow:10px 10px 0 #1B1E3F}
#bigplay:focus-visible,#controls button:focus-visible,#scrub:focus-visible,#chapters button:focus-visible{outline:4px solid var(--accent);outline-offset:3px}
#bigplay[hidden]{display:none}
#controls{display:flex;align-items:center;gap:14px;background:var(--bar);border:3px solid var(--line);border-radius:16px;padding:10px 14px}
#controls button{flex:none;width:46px;height:46px;border-radius:50%;border:3px solid var(--line);background:var(--chip);color:var(--bar-ink);cursor:pointer;display:grid;place-items:center;padding:0}
#scrub{flex:1;position:relative;height:30px;cursor:pointer;touch-action:none}
#rail{position:absolute;left:0;right:0;top:11px;height:8px;border-radius:4px;background:var(--chip);overflow:hidden}
#fill{position:absolute;left:0;top:0;bottom:0;background:var(--accent);width:0}
.mk{position:absolute;top:9px;width:3px;height:12px;background:var(--bar-ink);opacity:.35;border-radius:2px}
#knob{position:absolute;top:5px;width:20px;height:20px;margin-left:-10px;border-radius:50%;background:#FFC933;border:3px solid #1B1E3F}
#time{flex:none;font-variant-numeric:tabular-nums;font-variation-settings:'MONO' 1,'CASL' 0;font-size:15px;color:var(--muted);min-width:96px;text-align:right}
#chapters{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:thin}
#chapters button{flex:none;font:inherit;font-size:14px;font-weight:600;color:var(--bar-ink);background:var(--bar);border:2px solid var(--line);border-radius:999px;padding:7px 14px;cursor:pointer;white-space:nowrap}
#chapters button[aria-current="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) #chapters button[aria-current="true"]{color:#111329}}
:root[data-theme="dark"] #chapters button[aria-current="true"]{color:#111329}
@media (max-aspect-ratio: 5/4){#viewport{flex:none;aspect-ratio:16/9;min-height:0}#app{justify-content:center}}
@media (max-width:640px){#bigplay{width:84px;height:84px;margin:-42px 0 0 -42px;box-shadow:5px 5px 0 #1B1E3F}#bigplay svg{width:36px;height:36px}#app{padding:8px;gap:8px}#time{min-width:0;font-size:13px}#controls{gap:10px;padding:8px 10px}}
body.capture #app{padding:0;max-width:none;gap:0}
body.capture #viewport{border-radius:0}
body.capture #controls,body.capture #chapters,body.capture #bigplay{display:none}

/* ---------- stage content ---------- */
.scene{position:absolute;inset:0;display:none}
.scene svg.layer{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:visible}
.scene [data-in]{transform-box:fill-box;transform-origin:center}
.scene [data-fx="draw"]{stroke-dasharray:1 1}
.h1{text-wrap:balance;position:absolute;left:120px;top:66px;width:1680px;margin:0;font-size:66px;line-height:1.08;font-weight:840;font-variation-settings:'CASL' 1;letter-spacing:-.012em;color:#1B1E3F}
.lead{text-wrap:pretty;position:absolute;font-size:36px;line-height:1.32;font-weight:520;font-variation-settings:'CASL' .45}
.sm{font-size:30px}
.big{font-weight:820;font-variation-settings:'CASL' 1}
.stk{text-wrap:pretty;position:absolute;background:#fff;border:4px solid #1B1E3F;border-radius:22px;box-shadow:8px 8px 0 #1B1E3F;padding:20px 26px;font-size:30px;line-height:1.32;font-weight:540}
.stk.orange{background:#FFE2D1}.stk.green{background:#D2F2E3}.stk.blue{background:#DCE2FF}.stk.yellow{background:#FFF0C2}
.flex{display:flex;gap:18px;align-items:flex-start}
.flex .ic{flex:none;margin-top:1px}
b,strong{font-weight:800;font-variation-settings:'CASL' .9}
code,.mono{font-variation-settings:'MONO' 1,'CASL' 0;font-weight:620}
.lead code,.stk code{font-size:.86em;background:#fff;border:3px solid #1B1E3F;border-radius:10px;padding:0 .22em}
.stk.orange code,.stk.green code,.stk.blue code,.stk.yellow code{background:rgba(255,255,255,.75)}
.term{position:absolute;background:#1B1E3F;color:#F3F4FF;border:4px solid #1B1E3F;border-radius:18px;box-shadow:8px 8px 0 #3550FF;padding:22px 30px;font-size:30px;line-height:1.5;font-variation-settings:'MONO' 1,'CASL' 0;font-weight:560;white-space:pre}
.term .p{color:#FFC933}.term .ok{color:#62E3A9}.term .dim{color:#A4A9D6}
.term .cl{margin:0 -14px;padding:0 14px;border-radius:8px}
.caret{display:inline-block;width:.55em;height:.95em;background:#FFC933;vertical-align:-.12em;margin-left:.08em}
.ci{position:absolute;display:flex;align-items:center;gap:14px;font-size:30px;font-weight:600}
svg text{font-family:'Rec',sans-serif}
.tb{font-weight:820;font-variation-settings:'CASL' 1}
.tr{font-weight:540;font-variation-settings:'CASL' .45}
.tm{font-weight:600;font-variation-settings:'MONO' 1,'CASL' 0}
</style>
</head>
<body>
<div id="app">
  <div id="viewport">
    <div id="stage" role="img" aria-label="Animated explainer: how a line of Python becomes work on a GPU, covering infrastructure layers, CPU, memory, storage, networking, the NVIDIA stack, containers, a measured GPU experiment and monitoring.">
      <svg width="0" height="0" style="position:absolute" aria-hidden="true">
        <defs>
          <symbol id="mascot" viewBox="0 0 130 140">
            <rect x="16" y="30" width="104" height="104" rx="26" fill="#1B1E3F"/>
            <path d="M60 22 V9" stroke="#1B1E3F" stroke-width="5" stroke-linecap="round"/>
            <circle cx="60" cy="8" r="7" fill="#FFC933" stroke="#1B1E3F" stroke-width="4"/>
            <rect x="8" y="22" width="104" height="104" rx="26" fill="#3550FF" stroke="#1B1E3F" stroke-width="5"/>
            <path d="M43 25 V123 M77 25 V123 M11 57 H109 M11 91 H109" stroke="#fff" stroke-opacity=".2" stroke-width="3"/>
            <circle cx="42" cy="62" r="13" fill="#fff" stroke="#1B1E3F" stroke-width="4"/>
            <circle cx="78" cy="62" r="13" fill="#fff" stroke="#1B1E3F" stroke-width="4"/>
            <circle cx="45" cy="65" r="6" fill="#1B1E3F"/><circle cx="81" cy="65" r="6" fill="#1B1E3F"/>
            <ellipse cx="27" cy="92" rx="9" ry="6" fill="#FF7BB0"/><ellipse cx="93" cy="92" rx="9" ry="6" fill="#FF7BB0"/>
            <path d="M48 93 Q60 106 72 93" fill="none" stroke="#1B1E3F" stroke-width="5" stroke-linecap="round"/>
          </symbol>
          <symbol id="chef" viewBox="0 0 70 90">
            <path d="M14 36 h42 v-10 a12 12 0 0 0 -6 -22 a14 14 0 0 0 -30 0 a12 12 0 0 0 -6 22 z" fill="#fff" stroke="#1B1E3F" stroke-width="3.5" stroke-linejoin="round"/>
            <circle cx="35" cy="60" r="20" fill="#FFD9A8" stroke="#1B1E3F" stroke-width="3.5"/>
            <circle cx="28" cy="58" r="2.8" fill="#1B1E3F"/><circle cx="42" cy="58" r="2.8" fill="#1B1E3F"/>
            <path d="M29 67 Q35 72 41 67" fill="none" stroke="#1B1E3F" stroke-width="3" stroke-linecap="round"/>
          </symbol>
        </defs>
      </svg>
      <!--SCENES-->
      <svg id="track" class="layer" viewBox="0 0 1920 1080" style="position:absolute;left:0;top:0;width:1920px;height:1080px;pointer-events:none"></svg>
      <svg id="wipe" viewBox="0 0 1920 1080" style="position:absolute;left:0;top:0;width:1920px;height:1080px;pointer-events:none;display:none"></svg>
    </div>
    <button id="bigplay" aria-label="Play the explainer"><svg width="56" height="56" viewBox="0 0 56 56" aria-hidden="true"><path d="M18 10 L46 28 L18 46 Z" fill="#1B1E3F" stroke="#1B1E3F" stroke-width="4" stroke-linejoin="round"/></svg></button>
  </div>
  <div id="controls">
    <button id="pp" aria-label="Play"></button>
    <div id="scrub" role="slider" tabindex="0" aria-label="Seek through the explainer" aria-valuemin="0" aria-valuemax="0" aria-valuenow="0">
      <div id="rail"><div id="fill"></div></div><div id="marks"></div><div id="knob"></div>
    </div>
    <span id="time">0:00 / 0:00</span>
  </div>
  <nav id="chapters" aria-label="Chapters"></nav>
</div>
<script>
// ================= timing utils (loaded first) =================
function P(t,a,b){return t<=a?0:t>=b?1:(t-a)/(b-a);}
const E={
  out:x=>1-Math.pow(1-x,3),
  inn:x=>x*x*x,
  io:x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2,
  back:x=>{if(x<=0)return 0;if(x>=1)return 1;const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2);}
};
const lerp=(a,b,p)=>a+(b-a)*p;

// ================= helpers =================
const C={ink:'#1B1E3F',blue:'#3550FF',green:'#0FA968',orange:'#FF6B1A',yellow:'#FFC933',pink:'#FF7BB0',lilac:'#B7AAFF',
  muted:'#5D628C',grey:'#E1E3EF',tb:'#DCE2FF',tg:'#D2F2E3',to:'#FFE2D1',ty:'#FFF0C2',tl:'#E9E4FF',mid:'#8D9BFF'};
const SCENES=[];
const S=d=>SCENES.push(d);
const cu=(at,fx='up',out,d)=>` data-in="${at}" data-fx="${fx}"${out!=null?` data-out="${out}"`:''}${d!=null?` data-d="${d}"`:''}`;
const k=n=>` data-k="${n}"`;
function sb(x,y,w,h,fill='#fff',r=22,sh=8,sw=4){
  return `<rect x="${x+sh}" y="${y+sh}" width="${w}" height="${h}" rx="${r}" fill="${C.ink}"/><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${r}" fill="${fill}" stroke="${C.ink}" stroke-width="${sw}"/>`;
}
function tx(x,y,s,o={}){const {size=30,c='tr',fill=C.ink,a='start',ex=''}=o;
  return `<text x="${x}" y="${y}" font-size="${size}" class="${c}" fill="${fill}" text-anchor="${a}"${ex}>${s}</text>`;}
const g=(at,inner)=>`<g${at}>${inner}</g>`;
const H=s=>`<h2 class="h1"${cu(0.15,'up')}>${s}</h2>`;
const div=(cls,style,at,inner)=>`<div class="${cls}" style="${style}"${at}>${inner}</div>`;
const svg=inner=>`<svg class="layer" viewBox="0 0 1920 1080" aria-hidden="true">${inner}</svg>`;
const ICON={
  warn:`<svg class="ic" viewBox="0 0 52 48" width="54" height="50" aria-hidden="true"><path d="M26 4 L49 44 H3 Z" fill="#FF6B1A" stroke="#1B1E3F" stroke-width="4" stroke-linejoin="round"/><path d="M26 18 V30" stroke="#1B1E3F" stroke-width="5" stroke-linecap="round"/><circle cx="26" cy="37.5" r="3.2" fill="#1B1E3F"/></svg>`,
  ok:`<svg class="ic" viewBox="0 0 48 48" width="46" height="46" aria-hidden="true"><circle cx="24" cy="24" r="21" fill="#0FA968" stroke="#1B1E3F" stroke-width="4"/><path d="M14 25 l7 7 l13 -15" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
  box:`<svg class="ic" viewBox="0 0 48 48" width="44" height="44" aria-hidden="true"><rect x="5" y="5" width="38" height="38" rx="9" fill="#fff" stroke="#1B1E3F" stroke-width="4"/><path d="M15 24 H33 M24 15 V33" stroke="#3550FF" stroke-width="0"/><circle cx="24" cy="24" r="6" fill="#3550FF"/></svg>`,
  no:`<svg class="ic" viewBox="0 0 48 48" width="46" height="46" aria-hidden="true"><circle cx="24" cy="24" r="21" fill="#FF6B1A" stroke="#1B1E3F" stroke-width="4"/><path d="M16 16 L32 32 M32 16 L16 32" stroke="#fff" stroke-width="5" stroke-linecap="round"/></svg>`
};
const warn=(x,y,w,at,html,out)=>div('stk orange flex',`left:${x}px;top:${y}px;width:${w}px`,cu(at,'pop',out),ICON.warn+`<div>${html}</div>`);
const good=(x,y,w,at,html,out)=>div('stk green flex',`left:${x}px;top:${y}px;width:${w}px`,cu(at,'pop',out),ICON.ok+`<div>${html}</div>`);
const okMark=(cx,cy,r=30)=>`<circle cx="${cx}" cy="${cy}" r="${r}" fill="${C.green}" stroke="${C.ink}" stroke-width="4"/><path d="M${cx-r*.45} ${cy+r*.05} l${r*.3} ${r*.3} l${r*.55} ${-r*.62}" fill="none" stroke="#fff" stroke-width="${r*.22}" stroke-linecap="round" stroke-linejoin="round"/>`;
const noMark=(cx,cy,r=30)=>`<circle cx="${cx}" cy="${cy}" r="${r}" fill="${C.orange}" stroke="${C.ink}" stroke-width="4"/><path d="M${cx-r*.35} ${cy-r*.35} L${cx+r*.35} ${cy+r*.35} M${cx+r*.35} ${cy-r*.35} L${cx-r*.35} ${cy+r*.35}" stroke="#fff" stroke-width="${r*.22}" stroke-linecap="round"/>`;
const mascotUse=(s=110)=>`<use href="#mascot" x="${-s/2}" y="${-s*0.55}" width="${s}" height="${s*140/130}"/>`;
function rnd(i){const x=Math.sin(i*12.9898+78.233)*43758.5453;return x-Math.floor(x);}
function scallop(cx,cy,r,n=8,amp=9){let d='';for(let a=0;a<=360;a+=3){const t=a*Math.PI/180,rr=r+amp*Math.cos(n*t);d+=(a?'L':'M')+(cx+rr*Math.cos(t)).toFixed(1)+' '+(cy+rr*Math.sin(t)).toFixed(1);}return d+'Z';}
function icon(name,x,y){ // 90x90 glyphs
  const I=C.ink, st=`stroke="${I}" stroke-width="4"`;
  let s='';
  if(name==='cpu'){s=`<rect x="22" y="22" width="46" height="46" rx="7" fill="${C.tb}" ${st}/><rect x="34" y="34" width="22" height="22" rx="4" fill="${C.blue}"/>`;
    for(let i=0;i<3;i++){const p=33+i*12;s+=`<path d="M${p} 10V22M${p} 68V80M10 ${p}H22M68 ${p}H80" ${st} stroke-linecap="round"/>`;}}
  if(name==='ram'){s=`<rect x="6" y="26" width="78" height="34" rx="5" fill="${C.tg}" ${st}/>`;for(let i=0;i<4;i++)s+=`<rect x="${14+i*17}" y="33" width="11" height="18" rx="2" fill="${I}"/>`;
    for(let i=0;i<7;i++)s+=`<path d="M${14+i*10} 60V70" ${st}/>`;}
  if(name==='gpu'){s=`<rect x="6" y="22" width="78" height="48" rx="7" fill="${C.ty}" ${st}/><circle cx="32" cy="46" r="15" fill="#fff" ${st}/><path d="M32 33 Q40 46 32 59 M19 46 Q32 38 45 46" ${st} fill="none"/><rect x="54" y="34" width="22" height="8" rx="3" fill="${I}"/><rect x="54" y="48" width="22" height="8" rx="3" fill="${I}"/><path d="M14 70V80M24 70V80" ${st}/>`;}
  if(name==='disk'){s=`<rect x="12" y="16" width="66" height="58" rx="10" fill="${C.tl}" ${st}/><path d="M24 34H66M24 46H56" ${st} stroke-linecap="round"/><circle cx="64" cy="62" r="5" fill="${C.green}" stroke="${I}" stroke-width="3"/>`;}
  if(name==='wifi'){s=`<path d="M17 42 Q45 16 73 42" ${st} fill="none" stroke-linecap="round"/><path d="M27 53 Q45 36 63 53" ${st} fill="none" stroke-linecap="round"/><path d="M37 64 Q45 56 53 64" ${st} fill="none" stroke-linecap="round"/><circle cx="45" cy="74" r="5" fill="${I}"/>`;}
  return `<g transform="translate(${x},${y})">${s}</g>`;
}
// moves through n stops: returns continuous index plus hop height
function walk(lt,t0,per,n){
  if(lt<t0) return {i:0,hop:0};
  const u=(lt-t0)/per, i=Math.floor(u);
  if(i>=n-1) return {i:n-1,hop:0};
  const f=u-i, mv=Math.min(1,f/0.5);
  return {i:i+E.io(mv),hop:f<0.5?Math.sin(Math.PI*mv)*34:0};
}

// ================= 0. title =================
{
  const L=[['Python','c = a @ b'],['PyTorch','tensor operation'],['CUDA libraries','GPU kernels'],['NVIDIA driver','device access'],['RTX 3070 GPU','does the math']];
  let s='';
  L.forEach((l,i)=>{const y=150+i*160;
    if(i<4) s+=`<path d="M1450 ${y+122} V${y+158}" stroke="${C.ink}" stroke-width="4" stroke-dasharray="6 8"${cu(1.2+i*0.18,'fade')}/>`;
    s+=g(cu(1.0+i*0.18,'pop'), sb(1150,y,600,112,i===4?C.ty:'#fff',56)+`<rect${k('hl'+i)} x="1155" y="${y+5}" width="590" height="102" rx="51" fill="${C.yellow}" opacity="0"/>`+
      tx(1196,y+68,l[0],{size:38,c:'tb'})+tx(1712,y+66,l[1],{size:24,c:'tm',fill:C.muted,a:'end'}));
  });
  S({id:'title',ch:-1,dur:9,html:`
  <div class="term" style="left:120px;top:150px;width:700px;font-size:48px"${cu(0.2,'pop')}><span class="p">&gt;&gt;&gt;</span> <span${cu(0.7,'type')} data-text="c = a @ b"></span><span class="caret"${k('caret')}></span></div>
  <h1 class="h1" style="top:330px;width:900px;font-size:84px;line-height:1.04"${cu(2.0,'up')}>How does one line of Python become real work on a GPU?</h1>
  <div class="lead" style="left:120px;top:640px;width:820px"${cu(3.1,'up')}>AI infrastructure, day 1: a trip from Linux down to the GPU, and how to measure what happens.</div>
  ${svg(s+`<g${k('m')} transform="translate(1825,206) scale(0)">${mascotUse(110)}</g>`)}`,
  up(lt,$){
    $.caret.style.opacity=Math.floor(lt*2.4)%2?0:1;
    const w=walk(lt,4.0,0.85,5), sc=E.back(P(lt,1.5,2.0));
    $.m.setAttribute('transform',`translate(1825,${206+w.i*160-w.hop}) scale(${sc})`);
    for(let i=0;i<5;i++) $['hl'+i].setAttribute('opacity',lt>3.6?Math.max(0,1-Math.abs(w.i-i)*1.6)*0.85:0);
  }});
}

// ================= 1. why infra =================
{
  const TW=[['Users &amp; applications','API requests, availability, latency',C.ty],['Serving &amp; operations','model server, load balancing, monitoring',C.tl],
    ['Orchestration','containers, Kubernetes, scheduling',C.tb],['Runtime','PyTorch, CUDA libraries, GPU driver',C.tg],['Hardware','CPUs, GPUs, RAM and VRAM, SSDs, networks','#fff']];
  let t='';
  TW.forEach((b,i)=>{const y=290+i*132;
    t+=g(cu(1.0+(4-i)*0.25,'down'), sb(1000,y,760,116,b[2],20)+tx(1032,y+50,b[0],{size:34,c:'tb'})+tx(1032,y+92,b[1],{size:25,fill:C.muted}));});
  t+=g(cu(1.0,'down',6.0),`<circle cx="1690" cy="348" r="38" fill="${C.yellow}" stroke="${C.ink}" stroke-width="4"/><circle cx="1677" cy="340" r="4.5" fill="${C.ink}"/><circle cx="1703" cy="340" r="4.5" fill="${C.ink}"/><path d="M1674 356 Q1690 372 1706 356" fill="none" stroke="${C.ink}" stroke-width="4" stroke-linecap="round"/>`);
  t+=g(cu(6.0,'pop'),`<circle cx="1690" cy="348" r="38" fill="#FFB38A" stroke="${C.ink}" stroke-width="4"/><circle cx="1677" cy="340" r="4.5" fill="${C.ink}"/><circle cx="1703" cy="340" r="4.5" fill="${C.ink}"/><path d="M1674 366 Q1690 350 1706 366" fill="none" stroke="${C.ink}" stroke-width="4" stroke-linecap="round"/>`);
  t+=`<path d="M1668 862 l18 20 l-16 18 l20 22" fill="none" stroke="${C.orange}" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" pathLength="1"${cu(5.0,'draw',null,0.4)}/>`;
  const extra=g(cu(5.0,'stamp'),`<g transform="rotate(-6 1630 822)">${sb(1510,790,240,64,C.orange,32,6)}${tx(1630,832,'Disk full!',{size:30,c:'tb',fill:'#fff',a:'middle'})}</g>`)+
    `<path d="M1812 900 V390" fill="none" stroke="${C.orange}" stroke-width="7" stroke-linecap="round" pathLength="1"${cu(5.4,'draw',null,0.6)}/>`+
    `<path d="M1796 400 L1812 372 L1828 400 Z" fill="${C.orange}" stroke="${C.orange}" stroke-width="4" stroke-linejoin="round"${cu(5.95,'pop')}/>`+
    g(cu(6.3,'pop'), sb(1262,196,370,64,'#fff',32,6)+`<path d="M1600 258 L1650 304 L1572 258" fill="#fff" stroke="${C.ink}" stroke-width="4" stroke-linejoin="round"/>`+tx(1447,238,'503: service unavailable',{size:22,c:'tm',a:'middle'}));
  S({id:'why',ch:0,dur:13,html:`${H('A correct model can still fail its users')}
  <div class="lead" style="left:120px;top:236px;width:800px"${cu(1.0)}>Real AI services are a stack. The model sits near the top, held up by everything below it.</div>
  <div class="lead" style="left:120px;top:470px;width:800px"${cu(5.6)}>When something low in the stack breaks (a full disk, a missing GPU, an overloaded API), users feel it at the top.</div>
  <div class="stk blue" style="left:120px;top:748px;width:800px;font-size:33px"${cu(8.6,'pop')}>AI infrastructure is everything that has to work around the model so it runs reliably, at scale, at a sane cost.</div>
  ${svg(`<g${k('tower')}>${t}</g>${extra}`)}`,
  up(lt,$){const a=lt>5.1&&lt<6.0?Math.sin(lt*58)*9*(1-P(lt,5.1,6.0)):0;$.tower.setAttribute('transform',`translate(${a.toFixed(2)},0)`);}});
}

// ================= 2. life cycle =================
{
  const cx=1290,cy=590,R=290, ang=[-90,-18,54,126,198];
  const ST=[['Prepare','data'],['Train','model'],['Evaluate,','register'],['Deploy,','serve'],['Monitor','outcomes']];
  const pt=(a,r=R)=>[cx+r*Math.cos(a*Math.PI/180),cy+r*Math.sin(a*Math.PI/180)];
  let s=`<path d="M${cx} ${cy-R} A${R} ${R} 0 1 1 ${cx-0.1} ${cy-R}" fill="none" stroke="${C.ink}" stroke-width="6" pathLength="1"${cu(0.5,'draw',null,1.2)}/>`;
  s+=g(cu(1.6,'fade'),[-54,18,90,162,234].map(a=>{const [x,y]=pt(a);return `<path d="M-13 -13 L13 0 L-13 13 Z" fill="${C.ink}" transform="translate(${x.toFixed(1)},${y.toFixed(1)}) rotate(${a+90})"/>`}).join(''));
  const [fx1,fy1]=pt(210),[fx2,fy2]=pt(258);
  s+=`<path d="M${fx1.toFixed(1)} ${fy1.toFixed(1)} A${R} ${R} 0 0 1 ${fx2.toFixed(1)} ${fy2.toFixed(1)}" fill="none" stroke="${C.blue}" stroke-width="16" stroke-linecap="round" pathLength="1"${cu(4.4,'draw',null,0.7)}/>`;
  s+=tx(1112,322,'feedback',{size:28,c:'tb',fill:C.blue,a:'end',ex:cu(4.9,'pop')});
  s+=`<circle${k('dot')} r="16" cx="0" cy="0" fill="${C.yellow}" stroke="${C.ink}" stroke-width="4" opacity="0"/>`;
  ST.forEach((l,i)=>{const [x,y]=pt(ang[i]);
    s+=g(cu(0.9+i*0.22,'pop'), sb(x-115,y-54,230,108,'#fff',22)+`<rect${k('st'+i)} x="${x-111}" y="${y-50}" width="222" height="100" rx="18" fill="${C.yellow}" opacity="0"/>`+
      tx(x,y-6,l[0],{size:30,c:'tb',a:'middle'})+tx(x,y+30,l[1],{size:30,c:'tb',a:'middle'}));});
  S({id:'loop',ch:0,dur:11,html:`${H('The model lives in a loop, not a notebook')}
  <div class="lead" style="left:120px;top:230px;width:780px"${cu(0.9)}>Data, training, evaluation, serving and monitoring repeat. What monitoring reveals feeds the next round.</div>
  <div class="stk" style="left:120px;top:478px;width:760px;padding:14px 24px"${cu(5.0,'left')}><b>Researcher</b>: makes the model good</div>
  <div class="stk" style="left:120px;top:590px;width:760px;padding:14px 24px"${cu(5.7,'left')}><b>ML engineer</b>: puts the model into products</div>
  <div class="stk blue" style="left:120px;top:702px;width:760px;padding:14px 24px"${cu(6.4,'left')}><b>AI infrastructure engineer</b>: launches, connects, accelerates, monitors and recovers the workloads</div>
  <div class="lead sm" style="left:120px;top:900px;width:760px;color:${C.muted}"${cu(8.2,'fade')}>Real job descriptions often overlap.</div>
  ${svg(s)}`,
  up(lt,$){const a=-90+Math.max(0,lt-2.2)*72, r=a*Math.PI/180;
    $.dot.setAttribute('cx',(cx+R*Math.cos(r)).toFixed(1));$.dot.setAttribute('cy',(cy+R*Math.sin(r)).toFixed(1));$.dot.setAttribute('opacity',P(lt,2.0,2.4));
    for(let i=0;i<5;i++){let d=((a-ang[i])%360+540)%360-180;$['st'+i].setAttribute('opacity',lt>2.2?Math.max(0,1-Math.abs(d)/26)*0.9:0);}
  }});
}

// ================= 3. node =================
{
  const res=(x,y,ic,title,l1,l2,at,fill='#fff')=>{const dx=960-(x+235),dy=560-(y+75);
    return `<g${cu(at,'from')} data-dx="${dx}" data-dy="${dy}">${sb(x,y,470,150,fill,22)}${icon(ic,x+22,y+30)}${tx(x+136,y+50,title,{size:32,c:'tb'})}${tx(x+136,y+90,l1,{size:26})}${tx(x+136,y+126,l2,{size:26})}</g>`;};
  const lines=[[425,405],[425,715],[1495,405],[1495,715],[960,865]].map((p,i)=>`<path d="M960 560 L${p[0]} ${p[1]}" stroke="${C.ink}" stroke-opacity=".35" stroke-width="4" fill="none" pathLength="1"${cu(3.0+i*0.1,'draw',null,0.5)}/>`).join('');

  document.getElementById('wnum').textContent=hit.ch+1;
  const tt=document.getElementById('wtitle');tt.textContent=CH_TITLE[hit.ch];tt.setAttribute('fill',dark?'#fff':C.ink);
  document.getElementById('wm').setAttribute('transform',`translate(1640,${(800-Math.abs(Math.sin(t*7))*26).toFixed(1)}) rotate(${(Math.sin(t*9)*8).toFixed(1)})`);
  document.getElementById('wp').setAttribute('transform',`translate(${off.toFixed(1)},0)`);
}

function renderAt(t){
  t=Math.max(0,Math.min(TOTAL,t));
  STAGE.style.backgroundPosition=`${(-t*10).toFixed(1)}px ${(-t*6).toFixed(1)}px`;
  SCENES.forEach((d,i)=>{
    const s=d.start,e=s+d.dur,tin=d.tin,tout=i<N-1?SCENES[i+1].tin:0;
    if(t<s-tin/2||t>e+tout/2||(i===N-1&&t>e)){if(d.el.style.display!=='none')d.el.style.display='none';return;}
    const a=i?P(t,s-tin/2,s+tin/2):1,b=i<N-1?1-P(t,e-tout/2,e+tout/2):1;
    d.el.style.display='block';d.el.style.opacity=Math.min(a,b).toFixed(3);
    d.el.style.transform=`translateY(${((1-a)*30-(1-b)*30).toFixed(1)}px)`;
    const lt=t-s;
    for(const c of d.cues)applyCue(c,lt);
    if(d.up)d.up(lt-d.off,d.$);
  });
  updateTrack(t);updateWipe(t);
}

// ================= player =================
const CAPTURE=/[?&]capture/.test(location.search);
if(CAPTURE)document.body.classList.add('capture');
const VP=document.getElementById('viewport');
function fit(){const r=VP.getBoundingClientRect(),s=Math.min(r.width/1920,r.height/1080);
  STAGE.style.transform=`translate(${((r.width-1920*s)/2).toFixed(1)}px,${((r.height-1080*s)/2).toFixed(1)}px) scale(${s})`;}
window.addEventListener('resize',fit);if('ResizeObserver' in window)new ResizeObserver(fit).observe(VP);fit();

let cur=0,playing=false,last=null;
const pp=document.getElementById('pp'),big=document.getElementById('bigplay'),scrub=document.getElementById('scrub'),fillEl=document.getElementById('fill'),knob=document.getElementById('knob'),timeEl=document.getElementById('time'),nav=document.getElementById('chapters');
const ICO={play:'<svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path d="M6 3 L17 10 L6 17 Z" fill="currentColor"/></svg>',
  pause:'<svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><rect x="4" y="3" width="4.5" height="14" rx="1.5" fill="currentColor"/><rect x="11.5" y="3" width="4.5" height="14" rx="1.5" fill="currentColor"/></svg>',
  replay:'<svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><path d="M5 11 a6 6 0 1 0 2 -4.5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/><path d="M4 3 V8 H9" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>'};
const fmt=s=>{s=Math.max(0,Math.round(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');};
scrub.setAttribute('aria-valuemax',Math.round(TOTAL));
document.getElementById('marks').innerHTML=chRange.map(r=>`<span class="mk" style="left:${(r[0]/TOTAL*100).toFixed(2)}%"></span>`).join('');
nav.innerHTML=CH.map((n,i)=>`<button type="button" data-c="${i}">${i+1}. ${n}</button>`).join('');
fit();
nav.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;seek(chRange[+b.dataset.c][0]+0.05);if(!playing)play();});
function ui(){
  const f=cur/TOTAL*100;fillEl.style.width=f+'%';knob.style.left=f+'%';timeEl.textContent=fmt(cur)+' / '+fmt(TOTAL);
  scrub.setAttribute('aria-valuenow',Math.round(cur));scrub.setAttribute('aria-valuetext',fmt(cur));
  const ended=cur>=TOTAL-0.01;
  pp.innerHTML=playing?ICO.pause:(ended?ICO.replay:ICO.play);pp.setAttribute('aria-label',playing?'Pause':(ended?'Replay':'Play'));
  big.hidden=playing||(cur>0.01&&!ended);big.setAttribute('aria-label',ended?'Replay the explainer':'Play the explainer');
  let ch=-1;chRange.forEach((r,i)=>{if(cur>=r[0]-0.01)ch=i;});
  nav.querySelectorAll('button').forEach((b,i)=>b.setAttribute('aria-current',i===ch?'true':'false'));
}
function tick(now){if(!playing)return;if(last!=null)cur+=Math.min(0.1,(now-last)/1000);last=now;
  if(cur>=TOTAL){cur=TOTAL;playing=false;}renderAt(cur);ui();if(playing)requestAnimationFrame(tick);}
function play(){if(cur>=TOTAL-0.01)cur=0;playing=true;last=null;ui();requestAnimationFrame(tick);}
function pause(){playing=false;ui();}
function seek(t){cur=Math.max(0,Math.min(TOTAL,t));renderAt(cur);ui();}
pp.addEventListener('click',()=>playing?pause():play());
big.addEventListener('click',play);
function scrubTo(e){const r=scrub.getBoundingClientRect();seek((e.clientX-r.left)/r.width*TOTAL);}
let dragging=false;
scrub.addEventListener('pointerdown',e=>{dragging=true;scrub.setPointerCapture(e.pointerId);scrubTo(e);});
scrub.addEventListener('pointermove',e=>{if(dragging)scrubTo(e);});
scrub.addEventListener('pointerup',()=>dragging=false);
scrub.addEventListener('keydown',e=>{if(e.key==='ArrowRight'){seek(cur+5);e.preventDefault();}if(e.key==='ArrowLeft'){seek(cur-5);e.preventDefault();}
  if(e.key==='Home'){seek(0);e.preventDefault();}if(e.key==='End'){seek(TOTAL);e.preventDefault();}});
document.addEventListener('keydown',e=>{if(e.target.closest&&e.target.closest('button,#scrub'))return;
  if(e.key===' '||e.key==='k'){e.preventDefault();playing?pause():play();}
  if(e.key==='ArrowRight')seek(cur+5);if(e.key==='ArrowLeft')seek(cur-5);});

window.TOTAL=TOTAL;window.renderAt=renderAt;
window.__total=TOTAL;window.__seek=seek;
const POSTER=CAPTURE?0:7.6; // show the finished title card behind the play button
document.fonts.ready.then(()=>{renderAt(cur===0?POSTER:cur);ui();window.READY=true;});
renderAt(POSTER);ui();

</script>
</body>
</html>
