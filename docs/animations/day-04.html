<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>How Linux runs services: systemd, journald &amp; cgroups</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#D7E5FB; --stage:#EEF4FF; --text:#1D1B3B; --muted:#4A4E7C; --wire:#1D1B3B;
  --line:#1D1B3B; --shadow:#1D1B3B; --paper:#FFFFFF; --term:#25234D; --termEdge:#1D1B3B; --termText:#E9E7FF;
  --foot:#1D1B3B; --yellow:#FFD23F; --tomato:#FF6B5B; --mint:#46D3A2; --blue:#5B8CFF; --lilac:#B9A0FF; --grey:#D9DEEE;
  --font:"Fredoka","Nunito","Trebuchet MS",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14162E; --stage:#1E2142; --text:#EEF0FF; --muted:#A8ADDA; --wire:#BCC1F2;
    --shadow:#07081A; --paper:#F7F5FF; --term:#0D0E24; --termEdge:#6E73BE; --termText:#E9E7FF; --grey:#C9CEE6; --foot:#9297CF;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#14162E; --stage:#1E2142; --text:#EEF0FF; --muted:#A8ADDA; --wire:#BCC1F2;
  --shadow:#07081A; --paper:#F7F5FF; --term:#0D0E24; --termEdge:#6E73BE; --termText:#E9E7FF; --grey:#C9CEE6; --foot:#9297CF;
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:var(--font);overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:3px;border-radius:10px}

.app{height:100%;display:flex;flex-direction:column;max-width:1400px;margin:0 auto;padding:12px clamp(8px,2vw,24px) 10px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:2px 4px 10px}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:clamp(.92rem,1.6vw,1.05rem);min-width:0}
.brand svg{flex:none}
.brand span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{display:inline-flex;align-items:center;gap:8px;border:3px solid var(--line);background:var(--paper);color:#1D1B3B;border-radius:14px;padding:6px 14px;font-weight:600;cursor:pointer;box-shadow:3px 3px 0 var(--shadow);transition:transform .12s, box-shadow .12s}
.btn:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--shadow)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--shadow)}

.stage{position:relative;flex:1;min-height:0;background:var(--stage);border:3px solid var(--line);border-radius:26px;box-shadow:6px 6px 0 var(--shadow);overflow:hidden}
.scene{position:absolute;inset:0;display:grid;grid-template-columns:minmax(250px,32%) 1fr;grid-template-rows:auto 1fr;grid-template-areas:"head vis" "cap vis";column-gap:clamp(12px,2vw,28px);padding:clamp(18px,3vw,40px);opacity:0;visibility:hidden;transform:translateX(40px) scale(.985);transition:opacity .55s ease, transform .6s cubic-bezier(.2,.8,.2,1), visibility 0s linear .6s}
.scene.cur{opacity:1;visibility:visible;transform:none;transition:opacity .55s ease .08s, transform .6s cubic-bezier(.2,.8,.2,1) .08s, visibility 0s}
.scene.gone{transform:translateX(-40px) scale(.985)}
.head{grid-area:head;align-self:end}
.kick{display:inline-flex;align-items:center;gap:8px;margin:0 0 12px;font-size:.92rem;font-weight:600;color:#1D1B3B;background:var(--chip,var(--yellow));border:2.5px solid var(--line);border-radius:999px;padding:3px 12px 3px 4px}
.kick b{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--paper);border:2px solid var(--line);font-size:.8rem}
h2{margin:0;font-size:clamp(1.55rem,2.9vw,2.6rem);line-height:1.08;font-weight:600;letter-spacing:-.01em;text-wrap:balance}
.cap{grid-area:cap;align-self:start;margin-top:18px;display:flex;flex-direction:column;gap:10px}
.ln{margin:0;font-size:clamp(1rem,1.45vw,1.2rem);line-height:1.45;color:var(--muted);padding-left:14px;border-left:4px solid transparent;opacity:0;transform:translateY(10px);transition:opacity .45s, transform .45s, color .45s, border-color .45s;max-width:38ch}
.ln.show{opacity:1;transform:none}
.ln.now{color:var(--text);border-left-color:var(--chip,var(--yellow))}
.ln code,.qa code{font-family:var(--mono);font-size:.84em;background:var(--paper);color:#1D1B3B;border:2px solid var(--line);border-radius:7px;padding:0 5px;white-space:nowrap}
.vis{grid-area:vis;min-height:0;min-width:0;display:flex;align-items:center;justify-content:center}
.vis>svg{width:100%;height:100%;max-height:100%;overflow:visible}

/* chapter wipe */
.wipe{position:absolute;inset:0;z-index:5;pointer-events:none;display:grid;place-items:center;background:var(--chip,var(--yellow));border-radius:23px;transform:translateX(-102%);visibility:hidden}
.wipe.go{visibility:visible;animation:wipe 1.15s cubic-bezier(.7,0,.3,1) both}
.wipe span{font-size:clamp(1.4rem,3.4vw,2.6rem);font-weight:700;color:#1D1B3B;text-align:center;padding:0 20px}
.wipe small{display:block;font-size:.5em;font-weight:600;opacity:.75;margin-bottom:6px}
@keyframes wipe{0%{transform:translateX(-102%)}38%,62%{transform:translateX(0)}100%{transform:translateX(102%)}}

/* controls */
.ctrl{padding:12px 4px 2px}
.prog{display:flex;gap:4px;margin-bottom:10px}
.seg{flex:1;height:12px;border:2px solid var(--line);border-radius:6px;background:var(--paper);padding:0;cursor:pointer;overflow:hidden;position:relative}
.seg i{position:absolute;inset:0;width:0;background:var(--blue)}
.seg.ch0{margin-left:6px}
.seg:first-child{margin-left:0}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ib{width:46px;height:46px;justify-content:center;padding:0;border-radius:14px}
.ib svg{width:22px;height:22px}
.play{background:var(--yellow)}
.count{margin-left:auto;font-weight:600;font-size:.95rem;color:var(--muted);font-variant-numeric:tabular-nums}
.hint{font-size:.85rem;color:var(--muted)}

/* chapters menu */
.menu{position:absolute;right:clamp(8px,2vw,24px);top:62px;z-index:10;background:var(--paper);color:#1D1B3B;border:3px solid var(--line);border-radius:18px;box-shadow:5px 5px 0 var(--shadow);padding:8px;width:min(330px,calc(100vw - 24px));max-height:calc(100% - 90px);overflow:auto;display:none}
.menu.open{display:block}
.menu button{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:10px;cursor:pointer;font-weight:500;color:#1D1B3B}
.menu button:hover,.menu button.cur{background:#EEF2FF}
.menu b{display:inline-grid;place-items:center;flex:none;width:26px;height:26px;border-radius:50%;border:2px solid #1D1B3B;font-size:.8rem}

/* quiz */
.quiz{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;width:100%;max-height:100%;overflow:auto;padding:4px 10px 10px 4px}
.qa{position:relative;text-align:left;border:3px solid var(--line);border-radius:18px;background:var(--paper);color:#1D1B3B;box-shadow:4px 4px 0 var(--shadow);padding:14px 16px;cursor:pointer;min-height:150px;display:flex;flex-direction:column;gap:8px;transition:background .3s, transform .15s}
.qa:hover{transform:translate(-1px,-1px)}
.qa .tag{align-self:flex-start;font-weight:700;font-size:.85rem;border:2px solid #1D1B3B;border-radius:999px;padding:1px 10px}
.qa .q{font-weight:500;font-size:1.02rem;line-height:1.35}
.qa .ans{display:none;font-size:.98rem;line-height:1.4}
.qa .tap{margin-top:auto;font-size:.85rem;color:#4A4E7C}
.qa.flip{background:#E3FAF0}
.qa.flip .ans{display:block}
.qa.flip .tap{display:none}
.again{grid-column:1/-1;justify-self:start}

/* ---------- SVG vocabulary ---------- */
svg text{font-family:var(--font)}
.o{stroke:var(--line);stroke-width:3;stroke-linejoin:round}
.shd{fill:var(--shadow)}
.f-p{fill:var(--paper)} .f-y{fill:var(--yellow)} .f-r{fill:var(--tomato)} .f-m{fill:var(--mint)}
.f-b{fill:var(--blue)} .f-l{fill:var(--lilac)} .f-k{fill:var(--line)} .f-n{fill:none} .f-ft{fill:var(--foot)} .f-w{fill:var(--wire)} .f-g{fill:var(--grey)}
.f-t{fill:var(--term);stroke:var(--termEdge);stroke-width:3}
.f-st{fill:var(--stage)}
.w{stroke:var(--wire);stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
.wk{stroke:var(--line);stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
.dash{stroke-dasharray:9 8}
.t{fill:var(--text)} .tk{fill:#1D1B3B} .tm{fill:var(--muted)} .tt{fill:var(--termText)}
.tr{fill:#E8453A} .tg{fill:#13895F} .tmint{fill:var(--mint)} .tred{fill:var(--tomato)} .tyel{fill:var(--yellow)}
:root[data-theme="dark"] .tr{fill:#FF8A7D} :root[data-theme="dark"] .tg{fill:#5BE3B1}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tr{fill:#FF8A7D} :root:not([data-theme="light"]) .tg{fill:#5BE3B1}}
.mono{font-family:var(--mono)}
.mid{text-anchor:middle} .end{text-anchor:end}
.b{font-weight:600} .bb{font-weight:700}
.s13{font-size:13px}.s14{font-size:14px}.s15{font-size:15px}.s16{font-size:16px}.s17{font-size:17px}.s18{font-size:18px}.s19{font-size:19px}.s20{font-size:20px}.s22{font-size:22px}.s24{font-size:24px}.s26{font-size:26px}.s28{font-size:28px}.s32{font-size:32px}.s36{font-size:36px}.s44{font-size:44px}.s56{font-size:56px}

.a{transform-box:fill-box;transform-origin:center}
.on .pop{animation:pop .55s var(--d,0s) both}
.on .fade{animation:fin .5s var(--d,0s) both}
.on .rise{animation:rise .55s cubic-bezier(.2,.8,.3,1) var(--d,0s) both}
.on .drop{animation:drop .6s var(--d,0s) both}
.on .sr{animation:sr .55s cubic-bezier(.2,.8,.3,1) var(--d,0s) both}
.on .sl{animation:sl .55s cubic-bezier(.2,.8,.3,1) var(--d,0s) both}
.on .draw{stroke-dasharray:1;animation:draw var(--dur,1s) ease-in-out var(--d,0s) both}
.on .gx{transform-origin:left center;animation:gx var(--dur,.9s) cubic-bezier(.2,.8,.3,1) var(--d,0s) both}
.on .gy{transform-origin:center bottom;animation:gy var(--dur,.9s) cubic-bezier(.2,.8,.3,1) var(--d,0s) both}
.on .bob{animation:bob 2.2s ease-in-out infinite}
.on .spin{animation:spin var(--dur,2s) linear var(--d,0s) infinite}
.on .pulse{animation:pulse 1.1s ease-in-out var(--d,0s) infinite}
.on .stamp{animation:stamp .5s var(--d,0s) both}
.on .shake{animation:shake .5s var(--d,0s) 3}
.on .io{animation:fin .4s var(--d,0s) both, fout .4s var(--o,99s) forwards}
.on .pio{animation:pop .5s var(--d,0s) both, fout .35s var(--o,99s) forwards}
.on .travel{animation:travel var(--dur,2.4s) linear var(--d,0s) infinite}
.on .scroll{animation:scrollup var(--dur,8s) linear infinite}
.on .press{animation:press .5s var(--d,0s) both}
.on .hop{animation:hop5 7s ease-in-out var(--d,0s) both}
.on .sweep{animation:sweep 6s ease-in-out var(--d,0s) both}
.on .bump{animation:bump 3.6s ease-in-out var(--d,0s) both}
.on .needle{transform-origin:center bottom;animation:needle 4s cubic-bezier(.3,.7,.3,1) var(--d,0s) both}
.on .fl{transform-origin:center bottom;animation:fillloop 3s linear var(--d,0s) infinite}
.on .close{animation:closeout .45s ease-in var(--d,0s) forwards}
@keyframes pop{0%{opacity:0;transform:scale(.3)}60%{opacity:1;transform:scale(1.08)}100%{opacity:1;transform:scale(1)}}
@keyframes fin{from{opacity:0}to{opacity:1}}
@keyframes fout{from{opacity:1}to{opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@keyframes drop{0%{opacity:0;transform:translateY(-70px)}70%{opacity:1;transform:translateY(5px)}100%{opacity:1;transform:none}}
@keyframes sr{from{opacity:0;transform:translateX(-40px)}to{opacity:1;transform:none}}
@keyframes sl{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes gx{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes gy{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.14)}}
@keyframes stamp{0%{opacity:0;transform:scale(2.2) rotate(-14deg)}70%{opacity:1;transform:scale(.95) rotate(-5deg)}100%{opacity:1;transform:scale(1) rotate(-5deg)}}
@keyframes shake{0%,100%{transform:rotate(0)}25%{transform:rotate(-5deg)}75%{transform:rotate(5deg)}}
@keyframes travel{0%{opacity:0;transform:translateX(0)}12%,82%{opacity:1}100%{opacity:0;transform:translateX(var(--dx,300px))}}
@keyframes scrollup{from{transform:translateY(0)}to{transform:translateY(var(--dy,-200px))}}
@keyframes press{0%,100%{transform:none}35%{transform:translate(3px,3px)}}
@keyframes fillloop{0%{transform:scaleY(.12)}70%{transform:scaleY(1)}74%,100%{transform:scaleY(.12)}}
@keyframes closeout{from{opacity:1;transform:scale(1)}to{opacity:0;transform:scale(.2)}}
@keyframes hop5{
  0%{transform:translate(0,0)} 6%{transform:translate(77px,-50px)} 12%,24%{transform:translate(155px,0)}
  30%{transform:translate(232px,-50px)} 36%,48%{transform:translate(310px,0)}
  54%{transform:translate(387px,-50px)} 60%,72%{transform:translate(465px,0)}
  78%{transform:translate(542px,-50px)} 84%,100%{transform:translate(620px,0)}}
@keyframes sweep{0%{transform:translateY(0)} 18%,24%{transform:translateY(64px)} 40%,46%{transform:translateY(128px)} 62%,100%{transform:translateY(192px)}}
@keyframes bump{0%{transform:translateX(0)} 30%{transform:translateX(205px)} 38%{transform:translateX(178px)} 55%{transform:translateX(205px)} 63%{transform:translateX(184px)} 100%{transform:translateX(184px)}}
@keyframes needle{0%{transform:rotate(-90deg)} 100%{transform:rotate(84deg)}}

.stage.paused .scene *{animation-play-state:paused !important}

@media (max-width: 899px), (orientation: portrait){
  .scene{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr) auto;grid-template-areas:"head" "vis" "cap";padding:16px 16px 14px}
  .head{align-self:start}
  .kick{margin-bottom:8px;font-size:.82rem}
  .cap{margin-top:8px;gap:6px}
  .ln{max-width:none;font-size:.98rem}
  .ln:not(.now){display:none}
  .quiz{grid-template-columns:1fr}
  .hint{display:none}
}
@media (max-width: 520px){
  .app{padding:8px 8px 6px}
  .stage{border-radius:20px;box-shadow:4px 4px 0 var(--shadow)}
  .ib{width:42px;height:42px}
  .brand span{font-size:.88rem}
  .brand .long{display:none}
  .prog{gap:2px}
  .seg{height:9px;border-width:1.5px;border-radius:4px}
  .seg.ch0{margin-left:3px}
}
.brand .short{display:none}
@media (max-width:520px){.brand .short{display:inline}}
@media (prefers-reduced-motion: reduce){
  .scene,.scene.cur,.ln{transition:none !important}
  .scene *{animation-duration:1ms !important;animation-delay:0s !important;animation-iteration-count:1 !important}
  .wipe{display:none}
  .scene .travel{visibility:hidden}
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--wire)"/></marker>
    <marker id="ahk" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--line)"/></marker>
  </defs>
</svg>
<div class="app">
  <header class="top">
    <div class="brand">
      <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><rect x="3" y="4" width="28" height="27" rx="12" fill="#46D3A2" stroke="#1D1B3B" stroke-width="2.5"/><circle cx="12.5" cy="15" r="3.6" fill="#fff" stroke="#1D1B3B" stroke-width="2"/><circle cx="21.5" cy="15" r="3.6" fill="#fff" stroke="#1D1B3B" stroke-width="2"/><circle cx="13" cy="15.5" r="1.6" fill="#1D1B3B"/><circle cx="22" cy="15.5" r="1.6" fill="#1D1B3B"/><path d="M13 22 Q17 25 21 22" stroke="#1D1B3B" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
      <span class="long">AI Infrastructure, Day 4: how Linux runs services</span><span class="short">Day 4: Linux services</span>
    </div>
    <button class="btn" id="chapBtn" aria-expanded="false" aria-controls="menu">
      <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M3 4h12M3 9h12M3 14h8" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>Chapters</button>
  </header>
  <div class="menu" id="menu" role="menu"></div>
  <main class="stage" id="stage">
    <div class="wipe" id="wipe"><span></span></div>
  </main>
  <nav class="ctrl" aria-label="Player controls">
    <div class="prog" id="prog"></div>
    <div class="bar">
      <button class="btn ib" id="prev" aria-label="Previous scene"><svg viewBox="0 0 24 24"><path d="M15 5 L8 12 L15 19" stroke="#1D1B3B" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <button class="btn ib play" id="play" aria-label="Pause"><svg viewBox="0 0 24 24" id="playIcon"></svg></button>

      <button class="btn ib" id="replay" aria-label="Replay this scene"><svg viewBox="0 0 24 24"><path d="M5 12a7 7 0 1 0 2.2-5.1" stroke="#1D1B3B" stroke-width="2.6" fill="none" stroke-linecap="round"/><path d="M4 4v5h5" stroke="#1D1B3B" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <span class="hint">Space to pause, arrow keys to skip</span>
      <span class="count" id="count"></span>
    </div>
  </nav>
</div>
<script>
/* ---------- tiny SVG toolkit ---------- */
const S=(x,y,w,h,f='p',rx=14)=>`<rect x="${x+5}" y="${y+5}" width="${w}" height="${h}" rx="${rx}" class="shd"/><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${rx}" class="o f-${f}"/>`;
const R=(x,y,w,h,cls,rx=0,st='')=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${rx}" class="${cls}"${st?` style="${st}"`:''}/>`;
const T=(x,y,s,cls='t s20')=>`<text x="${x}" y="${y}" class="${cls}">${s}</text>`;
const A=(cls,d,inner,o,extra='')=>`<g class="a ${cls}" style="--d:${d}s${o!=null?`;--o:${o}s`:''}${extra}">${inner}</g>`;
const G=(x,y,inner,s=1)=>`<g transform="translate(${x} ${y})${s!==1?` scale(${s})`:''}">${inner}</g>`;
const P=(d,cls='w',st='')=>`<path d="${d}" class="${cls}"${st?` style="${st}"`:''}/>`;
const D=(d,dl,dur=.8,cls='w')=>`<path d="${d}" class="${cls} a draw" pathLength="1" style="--d:${dl}s;--dur:${dur}s"/>`;
const head=(x,y,ang,dl,ink)=>`<g transform="translate(${x} ${y}) rotate(${ang})"><g class="a fade" style="--d:${dl}s"><path d="M-13 -8 L2 0 L-13 8 z" style="fill:var(${ink?'--line':'--wire'})"/></g></g>`;
function dA(x1,y1,x2,y2,dl,dur=.45,ink=false){
  const ang=Math.atan2(y2-y1,x2-x1)*180/Math.PI;
  return D(`M${x1} ${y1} L${x2} ${y2}`,dl,dur,ink?'wk':'w')+head(x2,y2,ang,dl+dur*.75,ink);
}
const cA=(d,x2,y2,ang,dl,dur=.6)=>D(d,dl,dur)+head(x2,y2,ang,dl+dur*.75);
const cnt=(a,b,t0,t1,dec=0)=>`data-count="${a},${b},${t0},${t1},${dec}"`;

function critter(c='m',pid='',mood='happy',bob=true,bd=0){

<script>
(()=>{
const $=s=>document.querySelector(s);
const stage=$('#stage'), prog=$('#prog'), wipe=$('#wipe'), menu=$('#menu'), chapBtn=$('#chapBtn');
const playBtn=$('#play'), playIcon=$('#playIcon'), countEl=$('#count');
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const esc=s=>s.replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
const strip=s=>s.replace(/<[^>]+>/g,'');
let idx=-1, t=0, playing=!RM, last=null;

SC.forEach((s,i)=>{
  const [cn,col]=CH[s.ch];
  const sec=document.createElement('section');
  sec.className='scene'; sec.setAttribute('aria-hidden','true'); sec.style.setProperty('--chip',col);
  const label=esc(s.title+'. '+s.beats.map(b=>strip(b[1])).join(' '));
  sec.innerHTML=`<div class="head"><p class="kick"><b>${s.ch+1}</b>${cn}</p><h2>${s.title}</h2></div>
    <div class="cap">${s.beats.map(b=>`<p class="ln">${b[1]}</p>`).join('')}</div>
    <div class="vis">${s.html?s.html:`<svg viewBox="0 0 800 480" role="img" aria-label="${label}">${s.svg}</svg>`}</div>`;
  stage.appendChild(sec);
  s.el=sec; s.lns=[...sec.querySelectorAll('.ln')];
  s.counts=[...sec.querySelectorAll('[data-count]')].map(el=>{const [a,b,t0,t1,dec]=el.dataset.count.split(',').map(Number);return{el,a,b,t0,t1,dec}});
  const seg=document.createElement('button');
  seg.className='seg'+(i>0&&SC[i-1].ch!==s.ch?' ch0':'');
  seg.setAttribute('aria-label',`Scene ${i+1}: ${s.title}`); seg.title=s.title;
  seg.innerHTML='<i></i>'; seg.addEventListener('click',()=>go(i));
  prog.appendChild(seg); s.bar=seg.firstChild;
});

// chapters menu
const firstOf=CH.map((_,c)=>SC.findIndex(s=>s.ch===c));
menu.innerHTML=CH.map(([n,col],c)=>`<button role="menuitem" data-c="${c}"><b style="background:${col}">${c+1}</b>${n}</button>`).join('');
menu.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;closeMenu();go(firstOf[+b.dataset.c]);});
function closeMenu(){menu.classList.remove('open');chapBtn.setAttribute('aria-expanded','false')}
chapBtn.addEventListener('click',e=>{e.stopPropagation();const o=menu.classList.toggle('open');chapBtn.setAttribute('aria-expanded',o)});
document.addEventListener('click',e=>{if(!menu.contains(e.target)&&e.target!==chapBtn)closeMenu()});

const fmt=(c,v)=>v.toFixed(c.dec);

function runWipe(s){
  wipe.style.setProperty('--chip',CH[s.ch][1]);
  wipe.firstElementChild.innerHTML=`<small>Chapter ${s.ch+1}</small>${CH[s.ch][0]}`;
  wipe.classList.remove('go'); void wipe.offsetWidth; wipe.classList.add('go');
}

function go(i){
  i=Math.max(0,Math.min(SC.length-1,i));
  const prev=SC[idx], s=SC[i];
  const chChange=prev&&prev.ch!==s.ch;
  SC.forEach((x,k)=>{
    if(k===i) return;
    x.el.classList.remove('cur','on'); x.el.classList.toggle('gone',k<i); x.el.setAttribute('aria-hidden','true');
  });
  s.el.classList.remove('gone','on'); void s.el.offsetWidth;
  s.el.classList.add('cur'); s.el.setAttribute('aria-hidden','false');
  idx=i;
  if(RM){
    t=0; s.el.classList.add('on');
    s.lns.forEach(l=>l.classList.add('show','now'));
    s.counts.forEach(c=>c.el.textContent=fmt(c,c.b));
  } else {
    s.lns.forEach(l=>l.classList.remove('show','now'));
    s.counts.forEach(c=>c.el.textContent=fmt(c,c.a));
    t=chChange?-720:(prev?-260:-500);
    if(chChange) runWipe(s);
    playing=true;
  }
  SC.forEach((x,k)=>x.bar.style.width=k<i?'100%':'0%');
  [...menu.children].forEach((b,c)=>b.classList.toggle('cur',c===s.ch));
  countEl.textContent=`${i+1} / ${SC.length}`;
  setPlay(playing);
}

function setPlay(p){
  playing=p;
  stage.classList.toggle('paused',!p&&!RM);
  playIcon.innerHTML=p?'<rect x="6" y="5" width="4" height="14" rx="1.5" fill="#1D1B3B"/><rect x="14" y="5" width="4" height="14" rx="1.5" fill="#1D1B3B"/>'
                      :'<path d="M8 5 L19 12 L8 19 z" fill="#1D1B3B" stroke="#1D1B3B" stroke-width="1.5" stroke-linejoin="round"/>';
  playBtn.setAttribute('aria-label',p?'Pause':'Play');
}
function togglePlay(){
  const s=SC[idx];
  if(!playing&&idx===SC.length-1&&t>=s.dur*1000){go(0);return}
  setPlay(!playing);
}

function tick(now){
  const dt=last==null?0:Math.min(100,now-last); last=now;
  const s=SC[idx];
  if(playing){
    t+=dt;
    if(!RM){
      if(t>=0&&!s.el.classList.contains('on')) s.el.classList.add('on');
      const ts=t/1000; let cur=-1;
      s.beats.forEach((b,k)=>{if(ts>=b[0])cur=k});
      s.lns.forEach((l,k)=>{l.classList.toggle('show',k<=cur);l.classList.toggle('now',k===cur)});
      s.counts.forEach(c=>{const p=Math.max(0,Math.min(1,(ts-c.t0)/(c.t1-c.t0)));c.el.textContent=fmt(c,c.a+(c.b-c.a)*p)});
    }
    if(t>=s.dur*1000){
      if(idx<SC.length-1) go(idx+1);
      else { t=s.dur*1000; setPlay(false); }
    }
  }
  SC[idx].bar.style.width=Math.max(0,Math.min(100,t/(SC[idx].dur*10)))+'%';
  requestAnimationFrame(tick);
}

$('#prev').addEventListener('click',()=>go(idx-1));
$('#next').addEventListener('click',()=>go(idx+1));
$('#replay').addEventListener('click',()=>go(idx));
playBtn.addEventListener('click',togglePlay);

stage.addEventListener('click',e=>{
  const q=e.target.closest('.qa');
  if(q){const f=q.classList.toggle('flip');q.setAttribute('aria-expanded',f);return}
  if(e.target.closest('#again')){stage.querySelectorAll('.qa').forEach(x=>{x.classList.remove('flip');x.setAttribute('aria-expanded','false')});go(0)}
});

document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'){go(idx+1);e.preventDefault()}
  else if(e.key==='ArrowLeft'){go(idx-1);e.preventDefault()}
  else if(e.key===' '||e.key==='k'){if(e.key===' '&&e.target.closest('button'))return;togglePlay();e.preventDefault()}
  else if(e.key==='Escape')closeMenu();
});

let tx=null,ty=null;
stage.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});
stage.addEventListener('touchend',e=>{
  if(tx==null)return;
  const dx=e.changedTouches[0].clientX-tx, dy=e.changedTouches[0].clientY-ty; tx=null;
  if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.5) go(idx+(dx<0?1:-1));
},{passive:true});

go(0);
requestAnimationFrame(tick);

// Deterministic timeline hooks used by html_to_mp4.py. Keep this in seconds,
// matching each scene's declared duration and the converter's seek requests.
window.__total = SC.reduce((sum, scene) => sum + scene.dur, 0);
window.__seek = seconds => {
  let ms = Math.max(0, Math.min(window.__total * 1000, seconds * 1000));
  let i = 0;
  while (i < SC.length - 1 && ms >= SC[i].dur * 1000) ms -= SC[i++].dur * 1000;
  if (idx !== i) go(i);
  setPlay(false);
  t = ms;
  wipe.classList.remove('go');
  const s = SC[i];
  s.el.classList.add('on');
  const ts = ms / 1000;
  let cur = -1;
  s.beats.forEach((beat, k) => { if (ts >= beat[0]) cur = k; });
  s.lns.forEach((line, k) => {
    line.classList.toggle('show', k <= cur);
    line.classList.toggle('now', k === cur);
  });
  s.counts.forEach(c => {
    const p = Math.max(0, Math.min(1, (ts - c.t0) / (c.t1 - c.t0)));
    c.el.textContent = fmt(c, c.a + (c.b - c.a) * p);
  });
  SC.forEach((scene, k) => { scene.bar.style.width = k < i ? '100%' : k === i ? `${Math.min(100, ms / (scene.dur * 10))}%` : '0%'; });
  // Restarting the CSS animations at a known scene time makes frame captures
  // independent of the converter's wall-clock speed.
  void s.el.offsetWidth;
  s.el.getAnimations({subtree:true}).forEach(animation => { animation.currentTime = ms; });
};
})();
</script>
</body>
