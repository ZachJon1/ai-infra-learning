apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: day15-web
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: day15-web

  minReplicas: 1
  maxReplicas: 5

  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 50

  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Pods
        value: 2
        periodSeconds: 30

    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Pods
        value: 1
        periodSeconds: 60
