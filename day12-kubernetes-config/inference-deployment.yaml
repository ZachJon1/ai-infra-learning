apiVersion: apps/v1
kind: Deployment
metadata:
  name: inference-deployment
spec:
  replicas: 2

  selector:
    matchLabels:
      app: inference

  template:
    metadata:
      labels:
        app: inference

    spec:
      containers:
        - name: inference
          image: alpine:3.20

          command:
            - sh
            - -c
            - |
              echo "MODEL_NAME=$MODEL_NAME"
              echo "BATCH_SIZE=$BATCH_SIZE"
              echo "LOG_LEVEL=$LOG_LEVEL"
              echo "DATABASE_HOST=$DATABASE_HOST"
              sleep 3600

          envFrom:
            - configMapRef:
                name: inference-config

          env:
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: inference-secret
                  key: DATABASE_PASSWORD
