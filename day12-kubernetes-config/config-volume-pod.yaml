apiVersion: v1
kind: Pod
metadata:
  name: config-volume-demo
spec:
  containers:
    - name: demo
      image: alpine:3.20
      command: ["sh", "-c", "sleep 3600"]

      volumeMounts:
        - name: config-volume
          mountPath: /etc/inference/config

        - name: secret-volume
          mountPath: /etc/inference/secrets
          readOnly: true

  volumes:
    - name: config-volume
      configMap:
        name: inference-config

    - name: secret-volume
      secret:
        secretName: inference-secret
