apiVersion: v1
kind: Pod
metadata:
  name: namespace-config-demo
  namespace: inference
spec:
  containers:
    - name: demo
      image: alpine:3.20
      command: ["sh", "-c", "sleep 3600"]

      env:
        - name: MODEL_NAME
          valueFrom:
            configMapKeyRef:
              name: inference-config
              key: MODEL_NAME
