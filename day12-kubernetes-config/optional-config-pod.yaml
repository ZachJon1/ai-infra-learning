apiVersion: v1
kind: Pod
metadata:
  name: optional-config-demo
spec:
  containers:
    - name: demo
      image: alpine:3.20
      command: ["sh", "-c", "sleep 3600"]

      env:
        - name: EXPERIMENTAL_FEATURE
          valueFrom:
            configMapKeyRef:
              name: experimental-config
              key: FEATURE_FLAG
              optional: true
