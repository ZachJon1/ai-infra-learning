apiVersion: batch/v1
kind: Job
metadata:
  name: day35-pytorch-gpu
  namespace: day35
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never

      nodeSelector:
        accelerator: gpu

      tolerations:
        - key: dedicated
          operator: Equal
          value: gpu
          effect: NoSchedule

      containers:
        - name: pytorch-gpu
          image: pytorch/pytorch:2.5.1-cuda12.4-cudnn9-runtime
          command: ["python", "-u", "-c"]
          args:
            - |
              import torch
              import time

              print("PyTorch:", torch.__version__)
              print("CUDA build:", torch.version.cuda)
              print("CUDA available:", torch.cuda.is_available())

              assert torch.cuda.is_available(), "CUDA unavailable"

              print("GPU:", torch.cuda.get_device_name(0))
              print("Visible GPUs:", torch.cuda.device_count())

              size = 3072
              a = torch.randn(size, size, device="cuda")
              b = torch.randn(size, size, device="cuda")

              # Warmup
              for _ in range(5):
                  c = a @ b
              torch.cuda.synchronize()

              start = time.perf_counter()

              for _ in range(20):
                  c = a @ b

              torch.cuda.synchronize()
              elapsed = time.perf_counter() - start

              print(f"20 GPU matmuls: {elapsed:.4f} seconds")
              print(f"Average: {elapsed / 20 * 1000:.2f} ms")
              print(
                  "Peak PyTorch GPU memory:",
                  round(torch.cuda.max_memory_allocated() / 2**20, 2),
                  "MiB"
              )

              print("GPU computation successful")
              time.sleep(15)

          resources:
            requests:
              cpu: "250m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
              nvidia.com/gpu: 1
