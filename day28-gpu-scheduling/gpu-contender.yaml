apiVersion: v1
kind: Pod
metadata:
  name: gpu-contender
  namespace: day28-gpu
spec:
  restartPolicy: Never
  containers:
    - name: worker
      image: busybox:1.36
      command: ["sh", "-c", "echo GPU contender started; sleep 3600"]
      resources:
        requests:
          cpu: "100m"
          memory: "64Mi"
        limits:
          memory: "128Mi"
          nvidia.com/gpu: 1
