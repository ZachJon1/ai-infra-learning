apiVersion: v1
kind: Pod
metadata:
  name: day55-taint-test
  labels:
    app: day55-taint-test
spec:
  restartPolicy: Never
  containers:
    - name: test-container
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
      resources:
        requests:
          cpu: 25m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 64Mi
