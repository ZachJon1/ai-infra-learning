apiVersion: v1
kind: Pod
metadata:
  name: oom-demo
  namespace: inference

spec:
  restartPolicy: Always

  containers:
    - name: memory-hog
      image: day20-inference:v1
      imagePullPolicy: IfNotPresent

      command:
        - python
        - -u
        - -c

      args:
        - |
          import time

          chunks = []

          print("Starting memory allocation")

          while True:
              chunks.append(bytearray(8 * 1024 * 1024))

              print(
                  f"Allocated {len(chunks) * 8} MiB"
              )

              time.sleep(0.1)

      resources:
        requests:
          cpu: "50m"
          memory: "32Mi"

        limits:
          cpu: "250m"
          memory: "64Mi"
