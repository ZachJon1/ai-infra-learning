apiVersion: apps/v1
kind: Deployment
metadata:
  name: inference-api
  namespace: inference
spec:
  replicas: 2

  selector:
    matchLabels:
      app: inference-api

  template:
    metadata:
      labels:
        app: inference-api

    spec:
      containers:
        - name: inference-api
          image: day20-inference:v1
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8080

          envFrom:
            - configMapRef:
                name: inference-config

            - secretRef:
                name: inference-secret

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "500m"
              memory: "256Mi"

          startupProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 2
            failureThreshold: 10

          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 10
