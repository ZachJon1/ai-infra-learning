
apiVersion: v1
kind: Pod
metadata:
  name: mig-inference-demo
  labels:
    app: mig-inference-demo

spec:
  restartPolicy: Never

  nodeSelector:
    accelerator: a100-mig

  tolerations:
    - key: dedicated
      operator: Equal
      value: gpu
      effect: NoSchedule

  containers:
    - name: cuda-test
      image: nvidia/cuda:12.4.1-base-ubuntu22.04

      command: ["bash", "-lc"]
      args:
        - "nvidia-smi -L && sleep 60"

      resources:
        requests:
          nvidia.com/mig-2g.10gb: 1
        limits:
          nvidia.com/mig-2g.10gb: 1
