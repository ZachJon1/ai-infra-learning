
apiVersion: v1
kind: Pod
metadata:
  name: day34-mig-failure
  labels:
    lab: day34-mig
spec:
  restartPolicy: Never

  tolerations:
    - key: dedicated
      operator: Equal
      value: gpu
      effect: NoSchedule

  containers:
    - name: diagnostic
      image: registry.k8s.io/pause:3.10

      resources:
        requests:
          nvidia.com/mig-2g.10gb: 1
        limits:
          nvidia.com/mig-2g.10gb: 1
