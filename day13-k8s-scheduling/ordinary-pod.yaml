apiVersion: v1
kind: Pod
metadata:
  name: ordinary-pod
spec:

  tolerations:
    - key: "dedicated"
      operator: "Equal"
      value: "gpu"
      effect: "NoSchedule"
 
  containers:
    - name: web
      image: nginx:alpine
      resources:
        requests:
          cpu: "100m"
          memory: "64Mi"
