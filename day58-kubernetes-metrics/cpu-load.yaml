apiVersion: v1
kind: Pod
metadata:
  name: cpu-metrics-demo
  labels:
    app: cpu-metrics-demo
spec:
  restartPolicy: Never
  containers:
    - name: cpu-worker
      image: busybox:1.36
      command: ["/bin/sh", "-c"]
      args:
        - "while true; do :; done"
      resources:
        requests:
          cpu: "100m"
          memory: "32Mi"
        limits:
          cpu: "500m"
          memory: "128Mi"
