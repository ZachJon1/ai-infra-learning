apiVersion: apps/v1
kind: Deployment
metadata:
  name: liveness-demo

spec:
  replicas: 1

  selector:
    matchLabels:
      app: liveness-demo

  template:
    metadata:
      labels:
        app: liveness-demo

    spec:
      containers:
        - name: app
          image: busybox:1.36

          command:
            - sh
            - -c
            - |
              echo "Container starting"
              touch /tmp/healthy

              while true; do
                sleep 3600
              done

          livenessProbe:
            exec:
              command:
                - test
                - -f
                - /tmp/healthy

            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
