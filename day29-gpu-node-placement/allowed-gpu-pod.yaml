apiVersion: v1
kind: Pod
metadata:
  name: gpu-placement-allowed
spec:
  nodeSelector:
    accelerator: gpu

  tolerations:
    - key: "dedicated"
      operator: "Equal"
      value: "gpu"
      effect: "NoSchedule"

  containers:
    - name: test
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
