<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 570" role="img" aria-labelledby="title desc">
<title id="title">Dockerized vLLM inference and central logging architecture</title>
<desc id="desc">Client traffic reaches Docker vLLM and NVIDIA GPU. Docker logs are read by Grafana Alloy through the Docker API and forwarded to Loki. Grafana queries Loki. Prometheus and DCGM are existing parallel metrics services, not proven connected to the new Grafana instance.</desc>
<defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#64748b"/></marker><style>text{font-family:Arial,Helvetica,sans-serif;fill:#14253d}.lbl{font-size:21px;font-weight:bold}.small{font-size:15px}.hint{font-size:14px;fill:#64748b}.panel{fill:#f7faff;stroke:#d8e2f0;stroke-width:2}.blue{fill:#edf5ff;stroke:#3974bf;stroke-width:2}.amber{fill:#fff5e3;stroke:#c98628;stroke-width:2}.violet{fill:#f4eeff;stroke:#8557b7;stroke-width:2}.green{fill:#ecf9f1;stroke:#31a26b;stroke-width:2}.gray{fill:#f1f5f9;stroke:#94a3b8;stroke-width:2}.edge{fill:none;stroke:#64748b;stroke-width:3;marker-end:url(#arr)}.dash{stroke-dasharray:8 7}</style></defs>
